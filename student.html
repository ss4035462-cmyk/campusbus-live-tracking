<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard | CampusBus</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="dashboard-body">
    <header class="app-header">
      <div class="brand small-brand">
        <img src="./assets/logo.svg" alt="CampusBus logo" />
        <div>
          <span class="brand-name">CampusBus</span>
        </div>
      </div>

      <nav class="top-actions" aria-label="Student navigation">
        <a href="./index.html">Home</a>
        <a href="./driver.html">Driver Login</a>
      </nav>
    </header>

    <main class="student-page">
      <section class="panel selector-panel">
        <h1>Track Your Bus</h1>

        <label for="busSelect" class="field-label">Select Bus</label>
        <select id="busSelect" class="select-box">
          <option value="">Loading buses...</option>
        </select>

        <div id="studentError" class="message error hidden"></div>
      </section>

      <section class="panel map-panel">
        <div id="studentMap" class="leaflet-map" aria-label="Live bus map"></div>
      </section>

      <section class="info-grid">
        <article class="panel info-card">
          <p class="card-label">Bus Number</p>
          <h3 id="busNumberValue">--</h3>
        </article>

        <article class="panel info-card">
          <p class="card-label">Route</p>
          <h3 id="routeNameValue">--</h3>
        </article>

        <article class="panel info-card">
          <p class="card-label">Status</p>
          <h3 id="statusValue" class="status-pill offline">Offline</h3>
        </article>
      </section>

      <section class="panel details-panel">
        <h2>Bus Information</h2>
        <div class="details-list">
          <div>
            <span class="detail-label">Starting Point</span>
            <strong id="startValue">--</strong>
          </div>
          <div>
            <span class="detail-label">Destination</span>
            <strong id="destinationValue">--</strong>
          </div>
          <div>
            <span class="detail-label">Last Updated</span>
            <strong id="lastUpdatedValue">Waiting for data</strong>
          </div>
          <div>
            <span class="detail-label">Estimated Arrival</span>
            <strong id="arrivalValue">Not available</strong>
          </div>
        </div>
      </section>

      <section class="panel route-panel">
        <div class="section-heading">
          <h2>Route & Stops</h2>
          <span id="selectedRouteBadge" class="route-badge">No route selected</span>
        </div>
        <ul id="routeStopsList" class="stop-list">
          <li>Waiting for route information...</li>
        </ul>
      </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script src="./js/student.js"></script>
  </body>
</html>
